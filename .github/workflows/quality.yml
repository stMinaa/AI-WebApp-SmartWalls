name: Quality & Architecture Checks

on:
  push:
    branches: [main, develop, refactor/*, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  backend-quality:
    name: Backend Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for CodeScene

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Run ESLint
        run: npm run lint

      - name: Check dependency boundaries
        run: npm run deps:check

      - name: Run architectural tests
        run: npm run test:arch

      # Unit tests only — integration tests require live MongoDB Atlas
      # and are run locally via 'npm test'
      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

  frontend-quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Initialize the frontend submodule

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
        env:
          HUSKY: '0'

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm run test:coverage
        env:
          CI: true

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build

  architecture-visualization:
    name: Generate Architecture Diagram
    runs-on: ubuntu-latest
    needs: [backend-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Generate dependency graph
        run: npm run deps:graph
        continue-on-error: true

      - name: Upload dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: dependency-graph.svg
          retention-days: 30
        if: always()

  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, architecture-visualization]
    if: always()

    steps:
      - name: Check job status
        run: |
          echo "🔍 Quality Gate Results:"
          echo "Backend Quality:  ${{ needs.backend-quality.result }}"
          echo "Frontend Quality: ${{ needs.frontend-quality.result }}"
          echo "Architecture:     ${{ needs.architecture-visualization.result }}"

          if [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.frontend-quality.result }}" != "success" ]; then
            echo "❌ Quality gate FAILED"
            exit 1
          else
            echo "✅ Quality gate PASSED"
          fi
